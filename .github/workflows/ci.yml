name: Django CI

on:
  push:
    branches: [ "main", "staging" ]
  pull_request:
    branches: [ "main", "staging" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
      with:
        python-version: '3.13'
        cache: 'pip'
    - name: Install Linting Tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort
    - name: Run Linter (flake8)
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Check Formatting (black & isort)
      run: |
        black --check .
        isort --check-only --profile black .

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
      with:
        python-version: '3.13'
        cache: 'pip'
    - name: Install Security Tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit semgrep
    - name: Security Scan (bandit)
      run: bandit -r . -x ./venv,./.venv
    - name: Static Analysis (Semgrep)
      run: semgrep --config auto .

  safety:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
    - name: Ensure requirements.txt is UTF-8
      run: |
        if [ -f requirements.txt ]; then
          python3 -c "content = open('requirements.txt', 'rb').read(); open('requirements.txt', 'wb').write(content.decode('utf-16' if content.startswith((b'\xff\xfe', b'\xfe\xff')) else 'utf-8-sig').encode('utf-8'))"
        fi
    - name: Security Scan (safety)
      uses: pyupio/safety-action@7baf6605473beffc874c1313ddf2db085c0cacf2  # v1
      with:
        api-key: ${{ secrets.SAFETY_API_KEY }}

  gitleaks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      with:
        fetch-depth: 0
    - name: Secret Scanning (Gitleaks)
      uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
    - name: Vulnerability Scan (Trivy)
      uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297  # master
      with:
        scan-type: 'fs'
        ignore-unfixed: true
        format: 'table'
        exit-code: '1'
        severity: 'CRITICAL,HIGH'

  django:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql/data
        command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
      with:
        python-version: '3.13'
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    - name: Install Dependencies
      run: |
        uv pip install --system -r requirements.txt
    - name: Django System Check
      run: |
        python manage.py check
#    - name: Run Tests with Coverage
#      run: |
#        coverage run manage.py test --noinput --parallel
#        coverage combine
#        coverage report
    - name: Run Tests
      run: python manage.py test --noinput --parallel
