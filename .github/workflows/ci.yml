name: Django CI

on:
  push:
    branches: [ "main", "staging" ]
  pull_request:
    branches: [ "main", "staging" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.13'
        cache: 'pip'
    - name: Install Linting Tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort
    - name: Run Linter (flake8)
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Check Formatting (black & isort)
      run: |
        black --check .
        isort --check-only --profile black .

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.13'
        cache: 'pip'
    - name: Install Security Tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit semgrep
    - name: Security Scan (bandit)
      run: bandit -r . -x ./venv,./.venv
    - name: Static Analysis (Semgrep)
      run: semgrep --config auto .

  gitleaks:
    runs-on: ubuntu-latest
    # Required on private repos: the default GITHUB_TOKEN is read-only once a
    # repository is private, and gitleaks-action needs pull-requests to read
    # PR commits and post review comments.
    permissions:
      contents: read
      pull-requests: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
    - name: Secret Scanning (Gitleaks)
      uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Vulnerability Scan (Trivy)
      uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e  # master
      with:
        scan-type: 'fs'
        ignore-unfixed: true
        format: 'table'
        exit-code: '1'
        severity: 'CRITICAL,HIGH'

  django:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql/data
        command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.13'
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    - name: Install Dependencies
      run: |
        uv pip install --system -r requirements.txt
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: '20'
        cache: 'npm'
    - name: Install frontend dependencies
      run: npm ci
    - name: Build frontend bundle
      run: npm run build
    - name: Django System Check
      run: |
        python manage.py check
    - name: Migration Check
      run: python manage.py makemigrations --check --dry-run

      #    - name: Run Tests with Coverage
#      run: |
#        coverage run manage.py test --noinput --parallel
#        coverage combine
#        coverage report
    - name: Run Tests
      run: python manage.py test --noinput --parallel
