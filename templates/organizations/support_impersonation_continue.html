{% extends "base.html" %}

{% block content %}
<div class="container py-5" style="max-width: 720px;">
    <div class="card shadow-sm">
        <div class="card-body">
            <h4 class="fw-bold">Continue to the organization portal</h4>
            <p class="text-muted">
                This step stays on this portal address so your existing tenant login is preserved
                until you review the final confirmation.
            </p>
            <form method="post" action="{{ redeem_url }}">
                {% csrf_token %}
                <input type="hidden" name="handoff_id" value="{{ handoff_id }}">
                <input type="hidden" name="handoff_token" value="{{ handoff_token }}">
                <button type="submit" class="btn btn-warning fw-semibold">
                    Continue securely
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
