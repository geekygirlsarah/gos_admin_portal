{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Server Error – Girls of Steel</title>
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'img/favicon-16x16.png' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">
    <link href="{% static 'css/site.css' %}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
<main class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card shadow-sm mt-5">
                <div class="card-body p-5 text-center">
                    <div class="mb-4">
                        <img src="{% static 'img/rosie_icon.png' %}" alt="Rosie Icon" width="80" height="80">
                    </div>
                    <h1 class="display-5 mb-3">500 Server Error</h1>
                    <p class="lead text-muted mb-4">Something went wrong on our end. We've been notified and are looking into it.</p>
                    <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                        <a href="/" class="btn btn-primary btn-lg px-4 gap-3">Back to Home</a>
                    </div>
                </div>
            </div>
            <p class="text-center text-muted small mt-4">
                If this issue persists, please contact <a href="mailto:leads@girlsofsteelrobotics.org">leads@girlsofsteelrobotics.org</a>.
            </p>
        </div>
    </div>
</main>
</body>
</html>
