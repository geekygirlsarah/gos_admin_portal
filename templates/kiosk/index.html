<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Attendance Kiosks — Girls of Steel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            background-color: #bad3fe;
            color: #000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 600px;
        }
        .card {
            background-color: #fff;
            border: 1px solid #aac4f0;
            border-radius: 1rem;
            overflow: hidden;
        }
        .card-header {
            background-color: #d6e8ff;
            border-bottom: 1px solid #aac4f0;
            padding: 1.5rem;
            text-align: center;
        }
        .list-group-item {
            border-left: none;
            border-right: none;
            padding: 1.25rem 1.5rem;
            font-size: 1.2rem;
            transition: background-color 0.2s;
        }
        .list-group-item:hover {
            background-color: #f0f7ff;
        }
        .list-group-item:first-child {
            border-top: none;
        }
        .list-group-item:last-child {
            border-bottom: none;
        }
        .btn-portal {
            margin-top: 1.5rem;
            color: #3a7bd5;
            text-decoration: none;
            font-weight: 500;
        }
        .btn-portal:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card shadow">
            <div class="card-header">
                <h1 class="h3 mb-0">Select a Kiosk</h1>
            </div>
            <div class="list-group list-group-flush">
                {% for kiosk in kiosks %}
                <a href="{% url 'kiosk_signin' kiosk.id %}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                    <div>
                        <strong>{{ kiosk.label }}</strong>
                        <div class="small text-muted">{{ kiosk.program.name }}</div>
                    </div>
                    <span class="badge bg-primary rounded-pill">&rarr;</span>
                </a>
                {% empty %}
                <div class="list-group-item text-center py-5 text-muted">
                    No active kiosks found.
                </div>
                {% endfor %}
            </div>
        </div>
        <div class="text-center">
            <a href="{% url 'home' %}" class="btn-portal">Back to Portal</a>
        </div>
    </div>
</body>
</html>
