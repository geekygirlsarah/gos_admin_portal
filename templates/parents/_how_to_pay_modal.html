<button
  type="button"
  class="btn btn-outline-primary"
  data-bs-toggle="modal"
  data-bs-target="#howToPayModal"
>
  How to Pay
</button>

<div
  class="modal fade"
  id="howToPayModal"
  tabindex="-1"
  aria-labelledby="howToPayModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title fs-5" id="howToPayModalLabel">How to Pay</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <h3 class="h6"><strong>Payment Instructions</strong></h3>
        {% if payment_instructions %}
          <p class="mb-3">{{ payment_instructions|linebreaksbr }}</p>
        {% else %}
          <p class="mb-3">Please contact the lead mentors to learn more about how to pay these dues.</p>
        {% endif %}

        {% if online_payment_url %}
          <h3 class="h6"><strong>Pay Online</strong></h3>
          <a class="btn btn-primary" href="{{ online_payment_url }}" target="_blank" rel="noopener">
            Go to Online Payment Portal
          </a>
        {% endif %}
      </div>
    </div>
  </div>
</div>
